[project]
name = "sentient-common"
version = "0.0.1"
description = "Shared utilities (structlog JSON logging, Fernet crypto) for Sentient Layer services."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.4",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_common"]
include = ["src/sentient_common/py.typed"]

[dependency-groups]
dev = [
    "pytest>=8",
]
