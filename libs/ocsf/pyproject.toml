[project]
name = "sentient-ocsf"
version = "0.0.1"
description = "OCSF 1.3.0 Pydantic models + Splunk → OCSF mappers"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_ocsf"]
