[project]
name = "sentient-mcp-splunk"
version = "0.0.1"
description = "MCP server exposing generic siem_* tools backed by Splunk"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sentient-common",
]
# NOTE: wk 2 adds `mcp[cli]`, `splunk-sdk` (PyPI name, not splunk-sdk-python),
# and `httpx` when the real siem_* tools land. Current file is a /health stub
# only so compose is healthy.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_mcp_splunk"]

[tool.uv.sources]
sentient-common = { workspace = true }
