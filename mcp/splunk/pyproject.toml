[project]
name = "sentient-mcp-splunk"
version = "0.0.1"
description = "MCP server exposing generic siem_* tools backed by Splunk"
requires-python = ">=3.12"
dependencies = [
    # FastMCP `streamable_http_app` + `@custom_route` need ≥1.27.
    "mcp[cli]>=1.27,<2",
    # Splunk client — PyPI name `splunk-sdk` (not `splunk-sdk-python`).
    "splunk-sdk>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    "starlette>=0.40",
    "anyio>=4.6",
    "sentient-common",
    # NOTE: `httpx` lands wk 8 with `siem_hec_post` (HEC needs different host
    # + token than the management REST endpoint). FastAPI removed wk 2 —
    # FastMCP returns a Starlette ASGI app directly via `streamable_http_app()`.
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "syrupy>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_mcp_splunk"]

[tool.uv.sources]
sentient-common = { workspace = true }
