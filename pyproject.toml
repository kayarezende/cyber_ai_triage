[project]
name = "sentient-layer"
version = "0.0.1"
description = "Australian-built AI SOC triage platform — Splunk-first MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/orchestrator",
    "apps/worker",
    "mcp/splunk",
    "libs/common",
    "libs/ocsf",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "black>=24",
    "mypy>=1.10",
    "pytest>=8",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=3.0",
    "minio>=7.2",  # used by db/seeds/setup_minio.py to create evidence bucket with Object Lock
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic migrations are (mostly) generated + contain long SQL strings;
# lint enforcement would force churn on landed, immutable files.
extend-exclude = [
    "db/migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "mcp", "libs"]
