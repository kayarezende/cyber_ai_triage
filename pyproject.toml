[project]
name = "sentient-layer"
version = "0.0.1"
description = "Australian-built AI SOC triage platform — Splunk-first MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/orchestrator",
    "apps/worker",
    "mcp/splunk",
    "libs/common",
    "libs/ocsf",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "black>=24",
    "mypy>=1.10",
    "pytest>=8",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=3.0",
    "minio>=7.2",  # used by db/seeds/setup_minio.py to create evidence bucket with Object Lock
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic migrations are (mostly) generated + contain long SQL strings;
# lint enforcement would force churn on landed, immutable files.
extend-exclude = [
    "db/migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.ruff.lint.isort]
known-first-party = ["sentient_api", "sentient_common", "sentient_mcp_splunk", "sentient_ocsf", "sentient_orchestrator", "sentient_worker"]
# `mcp/` exists as a workspace directory, but the `mcp` PyPI package is the
# Anthropic MCP SDK — keep it out of the first-party group.
known-third-party = ["mcp"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Tests live under multiple workspace members with the same relative path
# (`tests/`, `tests/conftest.py`). Mypy collides on the duplicate module
# names. Exclude tests from the type-check pass — pytest is the gate for
# test correctness; mypy still type-checks all production source.
exclude = [
    'apps/[a-z_]+/tests/.*',
    'libs/[a-z_]+/tests/.*',
    'mcp/[a-z_]+/tests/.*',
    'evals/harness/test_.*',
]

# Third-party libs without type stubs.
[[tool.mypy.overrides]]
module = ["splunklib", "splunklib.*"]
ignore_missing_imports = true

# FastMCP's `custom_route` decorator returns an untyped wrapper, which trips
# strict-mode `untyped-decorator` on legitimate route handlers. Disable the
# check for the small surface that uses it (just the MCP main entrypoint).
[[tool.mypy.overrides]]
module = ["sentient_mcp_splunk.main"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests", "apps", "mcp", "libs", "evals"]
markers = [
    "integration: requires live Splunk; founder-box only",
]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
