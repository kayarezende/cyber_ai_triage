[project]
name = "sentient-worker"
version = "0.0.1"
description = "Redis queue consumer"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "sentient-common[db]",
    # In-process dispatch — worker imports run_stub_investigation directly.
    # Wk-6 keeps the import path; the body of the function is replaced by the
    # real LangGraph runner.
    "sentient-orchestrator",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_worker"]

[tool.uv.sources]
sentient-common = { workspace = true }
sentient-orchestrator = { workspace = true }
