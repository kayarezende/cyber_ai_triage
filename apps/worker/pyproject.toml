[project]
name = "sentient-worker"
version = "0.0.1"
description = "Redis queue consumer"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    # storage extra needed for wk-9 resume_investigation path: imports
    # `evidence.py` → `sentient_common.storage` → `minio` (manifest upload
    # on resume completion).
    "sentient-common[db,storage]",
    # In-process dispatch — worker imports run_investigation directly.
    # Wk-6 swaps the body for the LangGraph Tier-2 runner; import path stable.
    "sentient-orchestrator",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_worker"]

[tool.uv.sources]
sentient-common = { workspace = true }
sentient-orchestrator = { workspace = true }
