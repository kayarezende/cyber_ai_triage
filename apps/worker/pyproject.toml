[project]
name = "sentient-worker"
version = "0.0.1"
description = "Redis queue consumer"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2",
    "httpx>=0.28",
    "sentient-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_worker"]

[tool.uv.sources]
sentient-common = { workspace = true }
