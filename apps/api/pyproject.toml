[project]
name = "sentient-api"
version = "0.0.1"
description = "FastAPI REST + webhook layer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "sentient-common[db,storage]",
    "sentient-ocsf",
    # Wk-9 replay endpoints + lifespan checkpointer pool. Same `>=3.0` pin
    # the orchestrator uses; psycopg-pool is transitive but listed for
    # explicitness given the api directly imports `AsyncConnectionPool`.
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg-pool>=3.2",
    # Cluster A migration sidecar reuses the api image to run
    # `alembic upgrade head` on cold-start. api itself never invokes
    # alembic — it's pulled in here so the sidecar can find the binary
    # in the api venv without a dedicated Dockerfile.
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_api"]

[tool.uv.sources]
sentient-common = { workspace = true }
sentient-ocsf = { workspace = true }
