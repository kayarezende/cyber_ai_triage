[project]
name = "sentient-api"
version = "0.0.1"
description = "FastAPI REST + webhook layer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "sentient-common[db,storage]",
    "sentient-ocsf",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_api"]

[tool.uv.sources]
sentient-common = { workspace = true }
sentient-ocsf = { workspace = true }
