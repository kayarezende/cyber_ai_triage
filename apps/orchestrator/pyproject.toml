[project]
name = "sentient-orchestrator"
version = "0.0.1"
description = "LangGraph agent runner"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=3.0",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langsmith>=0.2",
    "sentient-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentient_orchestrator"]

[tool.uv.sources]
sentient-common = { workspace = true }
